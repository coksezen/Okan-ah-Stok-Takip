<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <title>StokCep</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
    }
html,
body,
#root {
  min-height: 100%;
  background: #0f172a;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: env(safe-area-inset-top);
  background: #0f172a;
  z-index: 99999;
  pointer-events: none;
}
    #startup {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    #startup-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-90px);
    }

    #startup img {
      width: 90px;
      height: 90px;
      margin-bottom: 20px;
    }

    #startup strong {
      font-size: 32px;
      margin-bottom: 8px;
    }

    #startup span {
      font-size: 15px;
      opacity: 0.65;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="startup">
      <div id="startup-inner">
        <img src="/icon.svg" alt="Okan-Şah Gıda" />
        <strong>Okan-Şah Gıda</strong>
        <span>Stok ve Kantin Yönetimi</span>
      </div>
    </div>
  </div>

  <script>
    window.__STOKCEP_START__ = Date.now()
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
