name: One-time duplicate needs merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply duplicate-needs patch
        run: python .github/scripts/merge_duplicate_needs.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build
        run: npm run build

      - name: Commit app changes and cleanup
        run: |
          rm -f .github/scripts/merge_duplicate_needs.py
          rm -f .github/workflows/merge-duplicate-needs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge duplicate needs automatically"
          git push
