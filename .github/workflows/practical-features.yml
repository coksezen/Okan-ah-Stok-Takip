name: One-time practical features patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply practical features patch
        run: python .github/scripts/patch_practical_features.py

      - name: Commit app changes and cleanup
        run: |
          rm -f .github/scripts/patch_practical_features.py
          rm -f .github/workflows/practical-features.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add practical stock and needs workflows"
          git push
