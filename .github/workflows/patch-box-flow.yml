name: One-time box stock flow patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-box-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.jsx
        run: python .github/scripts/patch_box_flow.py

      - name: Remove one-time patch files and commit
        run: |
          rm .github/workflows/patch-box-flow.yml
          rm .github/scripts/patch_box_flow.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/patch-box-flow.yml .github/scripts/patch_box_flow.py
          git commit -m "Add barcode-first box and SKT tracking"
          git push
