name: One-time startup light band fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply startup light fix
        run: python .github/scripts/fix_startup_light_band.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build
        run: npm run build

      - name: Commit app changes and cleanup
        run: |
          rm -f .github/scripts/fix_startup_light_band.py
          rm -f .github/workflows/fix-startup-light-band.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match light startup background to status area"
          git push
