name: One-time dark mode patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-dark-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dark mode patch
        run: python .github/scripts/add_dark_mode.py

      - name: Commit app changes and cleanup
        run: |
          rm .github/workflows/add-dark-mode.yml
          rm .github/scripts/add_dark_mode.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css .github/workflows/add-dark-mode.yml .github/scripts/add_dark_mode.py
          git commit -m "Add persistent dark mode setting"
          git push
