name: Practical features hotfix and build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hotfix
        run: python .github/scripts/hotfix_practical_features.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build
        run: npm run build

      - name: Commit hotfix and cleanup
        run: |
          rm -f .github/scripts/hotfix_practical_features.py
          rm -f .github/workflows/practical-hotfix-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish practical workflows and verify build"
          git push
