name: One-time home and needs UX cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UX patch
        run: python .github/scripts/move_needs_home_cleanup.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify build
        run: npm run build

      - name: Commit app changes and cleanup
        run: |
          rm -f .github/scripts/move_needs_home_cleanup.py
          rm -f .github/workflows/move-needs-home-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move depot needs into Needs and clean home dashboard"
          git push
